<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Cervical Isometric Lateral Flexion &amp; Rotation</title>
  <desc>Patient seated upright, placing palm against side of head and gently pressing without allowing the head to move.</desc>
  <defs>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="165" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">CERVICAL • STRENGTHENING</text>

  <!-- Patient Torso (Frontal View) -->
  <circle cx="160" cy="80" r="20" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <!-- Neck -->
  <line x1="154" y1="100" x2="154" y2="115" stroke="#1e293b" stroke-width="4"/>
  <line x1="166" y1="100" x2="166" y2="115" stroke="#1e293b" stroke-width="4"/>
  <!-- Shoulders -->
  <path d="M 105 130 C 130 115, 190 115, 215 130 L 210 190 L 110 190 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Palm Against Side of Head (Right Hand) -->
  <path d="M 125 180 L 120 120 L 138 80" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Hand at temple -->
  <ellipse cx="138" cy="80" rx="6" ry="10" fill="#0284c7"/>

  <!-- Equal and Opposite Isometric Forces -->
  <line x1="115" y1="80" x2="132" y2="80" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowIn)"/>
  <line x1="162" y1="80" x2="148" y2="80" stroke="#0d9488" stroke-width="3" marker-end="url(#arrowIn)"/>

  <!-- Left Arm Relaxed at Side -->
  <path d="M 215 130 L 225 185" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cues -->
  <text x="185" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Zero Joint Movement</text>
  <text x="185" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Hand resists head gently</text>
  <text x="185" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Match pressure (~20-30%)</text>
  <text x="185" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Hold 5 seconds per side</text>
</svg>
