<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Standing Banded Hip Abduction</title>
  <desc>Patient standing upright holding support bar, abducting target leg laterally against looped resistance band around ankles.</desc>
  <defs>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="165" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">HIP • LATERAL STABILITY</text>

  <!-- Floor Line -->
  <line x1="25" y1="195" x2="295" y2="195" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Support Rail on Left -->
  <line x1="65" y1="100" x2="65" y2="195" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="65" cy="100" r="4" fill="#94a3b8"/>

  <!-- Patient Standing Upright -->
  <circle cx="120" cy="55" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <!-- Torso (Upright spine, no lateral trunk tilt) -->
  <line x1="120" y1="67" x2="120" y2="125" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Hand on Support Rail -->
  <line x1="120" y1="85" x2="68" y2="100" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Stance Leg (Vertical support) -->
  <line x1="115" y1="125" x2="115" y2="192" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 108 192 L 122 192" stroke="#1e293b" stroke-width="4"/>

  <!-- Target Abducting Leg (Out to side ~30°) -->
  <path d="M 125 125 L 165 185" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <path d="M 160 185 L 175 185" stroke="#0284c7" stroke-width="4"/>

  <!-- Looped Resistance Band Around Ankles -->
  <line x1="115" y1="180" x2="162" y2="175" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Lateral Movement Vector Arrow -->
  <path d="M 135 155 C 145 155, 160 157, 172 162" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- Cues -->
  <text x="185" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Keep Torso Upright</text>
  <text x="185" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Do not lean to the side</text>
  <text x="185" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Lead with heel, toes forward</text>
  <text x="185" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Control the return against band</text>
</svg>
