<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Cat-Camel (Spinal Mobility)</title>
  <desc>Patient on hands and knees, alternating between rounding the spine upward (camel) and gentle downward sagging (cat).</desc>
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#0284c7" />
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#0d9488" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="135" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">SPINE / CORE • MOBILITY</text>

  <!-- Mat Surface -->
  <line x1="25" y1="180" x2="295" y2="180" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms Vertical from Floor -->
  <line x1="105" y1="125" x2="105" y2="178" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Thighs Vertical from Knees on Floor -->
  <line x1="215" y1="130" x2="215" y2="178" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Lower legs on floor -->
  <line x1="215" y1="178" x2="250" y2="178" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Camel (Flexion upward curve) -->
  <path d="M 105 125 C 130 90, 190 90, 215 130" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Head tucked down -->
  <circle cx="85" cy="138" r="11" fill="#cbd5e1" stroke="#0284c7" stroke-width="3"/>

  <!-- Cat (Extension downward curve - ghosted) -->
  <path d="M 105 125 C 135 150, 185 150, 215 130" fill="none" stroke="#0d9488" stroke-width="3.5" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- Head looked up - ghosted -->
  <circle cx="85" cy="115" r="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- Directional Motion Arrows -->
  <line x1="160" y1="120" x2="160" y2="98" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowUp)"/>
  <line x1="160" y1="130" x2="160" y2="148" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Cues -->
  <text x="210" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Fluid Spinal Motion</text>
  <text x="210" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0284c7">1. Arch back up (Camel)</text>
  <text x="210" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0d9488">2. Sag back down (Cat)</text>
  <text x="210" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Move smoothly with breath</text>
</svg>
