<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>McKenzie Prone Press-Up (Lumbar Extension)</title>
  <desc>Patient prone on mat with hands under shoulders, pressing upper body up to extend lumbar spine while keeping pelvis completely relaxed on mat.</desc>
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="165" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">LUMBAR • EXTENSION MOBILITY</text>

  <!-- Mat Surface -->
  <line x1="25" y1="180" x2="295" y2="180" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Lower Body & Pelvis Resting Flat on Ground -->
  <path d="M 145 178 L 265 178" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Pelvis Grounded Indicator -->
  <ellipse cx="150" cy="178" rx="14" ry="4" fill="#0d9488"/>

  <!-- Ghosted Flat Prone Starting Position -->
  <path d="M 75 178 L 145 178" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="3 3"/>

  <!-- Curved Extended Upper Spine -->
  <path d="M 145 178 C 125 170, 95 130, 85 95" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Head (Looking gently forward/up) -->
  <circle cx="85" cy="80" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Extended Arms (Pressing hands into mat) -->
  <path d="M 98 120 L 115 178" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="110" y1="178" x2="125" y2="178" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Upward Press Vector Arrow -->
  <line x1="80" y1="140" x2="80" y2="105" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowUp)"/>

  <!-- Cues -->
  <text x="175" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Keep Pelvis on Floor</text>
  <text x="175" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Press up with arm strength only</text>
  <text x="175" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Allow lower back &amp; glutes to sag</text>
  <text x="175" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Hold 2–3s at end range, 10 reps</text>
</svg>
