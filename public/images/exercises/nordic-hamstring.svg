<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Nordic Hamstring Curl (Eccentric Hamstring Protocol)</title>
  <desc>Patient tall kneeling with ankles secured, slowly lowering straight torso forward under hamstring control.</desc>
  <defs>
    <linearGradient id="hamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="180" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">HAMSTRING • ECCENTRIC POWER</text>

  <!-- Mat Surface -->
  <line x1="25" y1="185" x2="295" y2="185" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Kneeling Pad under Knees -->
  <rect x="100" y="180" width="50" height="10" rx="3" fill="#94a3b8"/>

  <!-- Ankles Secured Clamp / Partner Hands -->
  <ellipse cx="65" cy="180" rx="12" ry="7" fill="#0284c7"/>
  <line x1="65" y1="180" x2="115" y2="180" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Ghosted Upright Kneeling Starting Position -->
  <path d="M 115 180 L 115 100" stroke="#cbd5e1" stroke-width="3.5" stroke-dasharray="3 3"/>
  <circle cx="115" cy="85" r="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- Active Forward Falling Torso (Controlled eccentric descent) -->
  <line x1="115" y1="180" x2="185" y2="120" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Head in Line with Spine -->
  <circle cx="195" cy="110" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Hamstring Active Tension Zone -->
  <line x1="108" y1="180" x2="145" y2="152" stroke="url(#hamGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Hands Ready in Front to Catch Chest -->
  <path d="M 175 125 L 210 140 L 210 155" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Forward-Down Descent Arc -->
  <path d="M 130 90 C 160 90, 185 100, 195 105" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="3 3" marker-end="url(#arrowDown)"/>

  <!-- Cues -->
  <text x="175" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Resist Gravity Slowly</text>
  <text x="175" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Ankles anchored firmly</text>
  <text x="175" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Keep hips extended straight</text>
  <text x="175" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Brake with hamstrings as far as able</text>
</svg>
