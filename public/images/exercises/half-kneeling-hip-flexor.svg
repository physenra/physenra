<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Half-Kneeling Hip Flexor Stretch</title>
  <desc>Patient in half-kneeling position with target back knee on padded mat, posterior pelvic tilt, gently gliding hips forward.</desc>
  <defs>
    <linearGradient id="psoasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="165" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">HIP FLEXOR / PSOAS • STRETCH</text>

  <!-- Floor Line -->
  <line x1="25" y1="190" x2="295" y2="190" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Cushion under kneeling knee -->
  <ellipse cx="105" cy="190" rx="16" ry="5" fill="#94a3b8"/>

  <!-- Head & Torso (Upright spine, tall posture) -->
  <circle cx="115" cy="65" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <line x1="115" y1="77" x2="115" y2="135" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Hands on Front Knee -->
  <path d="M 115 95 L 155 130" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Back Target Leg (Knee down on mat, hip in extension) -->
  <line x1="115" y1="135" x2="105" y2="188" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <line x1="105" y1="188" x2="70" y2="188" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Psoas / Anterior Hip Stretch Highlight -->
  <line x1="115" y1="125" x2="108" y2="155" stroke="url(#psoasGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Front Leg (Foot flat, knee at 90°) -->
  <path d="M 115 135 L 165 135 L 165 188" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 160 188 L 180 188" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Gentle Pelvic Shift Forward Arrow -->
  <line x1="118" y1="140" x2="138" y2="140" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowRight)"/>

  <!-- Cues -->
  <text x="180" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Tuck Pelvis Underneath</text>
  <text x="180" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Squeeze back glute firmly</text>
  <text x="180" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Shift forward until stretch is felt</text>
  <text x="180" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Do not hyperextend lower back</text>
</svg>
