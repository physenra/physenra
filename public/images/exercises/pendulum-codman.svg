<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Pendulum (Codman) Exercise</title>
  <desc>Patient leaning forward supported on table with non-involved arm, allowing involved arm to hang freely and swing in gentle circles using trunk momentum.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="135" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">SHOULDER • MOBILITY</text>

  <!-- Support Table -->
  <line x1="210" y1="125" x2="280" y2="125" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="255" y1="125" x2="255" y2="195" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Patient Staggered Legs -->
  <path d="M 85 195 L 105 145 M 125 195 L 115 145" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Torso Bent Forward at Waist -->
  <path d="M 110 145 L 180 115" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="195" cy="105" r="11" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Non-involved Support Arm on Table -->
  <path d="M 175 115 L 230 125" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Involved Arm Hanging Straight Down Relaxed -->
  <path d="M 155 125 L 155 175" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="155" cy="178" r="4" fill="#1e293b"/>

  <!-- Passive Circular Oscillation Ellipse & Arrow -->
  <ellipse cx="155" cy="188" rx="28" ry="10" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="3 3"/>
  <path d="M 183 188 L 181 180" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Clinical Cues -->
  <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Passive Arm Swing</text>
  <text x="25" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Arm hangs completely limp</text>
  <text x="25" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Move body to initiate swing</text>
  <text x="25" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Gentle circles clockwise/counter</text>
</svg>
