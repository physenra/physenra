<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Tandem Stance Balance Drill</title>
  <desc>Patient standing upright in heel-to-toe tandem alignment to challenge postural sway and static vestibular balance.</desc>
  <defs>
    <linearGradient id="balanceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="160" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">BALANCE / FALLS • POSTURE</text>

  <!-- Floor Line -->
  <line x1="25" y1="195" x2="295" y2="195" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Patient Standing Upright -->
  <circle cx="110" cy="55" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <line x1="110" y1="67" x2="110" y2="130" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Arms Across Chest or Hands on Hips -->
  <path d="M 98 88 L 110 95 L 122 88" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legs in Strict Tandem (Front heel directly touching back toes) -->
  <!-- Back Leg -->
  <line x1="110" y1="130" x2="100" y2="192" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Front Leg -->
  <line x1="110" y1="130" x2="120" y2="192" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Footprint Inset Diagram (Top-Down Tandem Alignment) -->
  <rect x="200" y="115" width="95" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="210" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#475569">FEET ALIGNMENT</text>
  <!-- Back Footprint -->
  <rect x="235" y="160" width="14" height="24" rx="6" fill="#cbd5e1" stroke="#94a3b8"/>
  <!-- Front Footprint (Directly in front, touching) -->
  <rect x="235" y="136" width="14" height="24" rx="6" fill="url(#balanceGrad)" stroke="#0d9488" stroke-width="1.5"/>
  <!-- Contact Line Indicator -->
  <line x1="230" y1="160" x2="254" y2="160" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Subtle Postural Sway Line -->
  <path d="M 110 38 Q 115 42 110 46 Q 105 50 110 54" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- Cues -->
  <text x="160" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Heel-to-Toe Stance</text>
  <text x="160" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Front heel touches back toes</text>
  <text x="160" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Fix eyes on a stationary point</text>
  <text x="160" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Hold 20–30s without stepping</text>
</svg>
