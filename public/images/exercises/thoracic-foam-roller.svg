<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Thoracic Extension over Foam Roller</title>
  <desc>Patient supine with foam roller positioned under mid-thoracic spine, hands supporting neck, gently extending upper back backwards over roller.</desc>
  <defs>
    <marker id="arrowCurve" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="145" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">THORACIC • MOBILITY</text>

  <!-- Mat Surface -->
  <line x1="25" y1="180" x2="295" y2="180" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Cylindrical Foam Roller under Upper/Mid Back -->
  <circle cx="125" cy="155" r="18" fill="#0d9488" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="125" cy="155" r="14" fill="#14b8a6"/>

  <!-- Lower Body on Mat (Pelvis on ground, knees bent) -->
  <path d="M 175 178 L 220 145 L 245 178" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 240 178 L 255 178" stroke="#1e293b" stroke-width="4"/>

  <!-- Torso Arching over Foam Roller -->
  <path d="M 175 178 C 145 150, 125 135, 95 140" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Head Supported by Interlaced Hands -->
  <circle cx="75" cy="148" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <!-- Support Arms Behind Head -->
  <path d="M 105 142 L 72 135 L 75 148" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Backward Extension Motion Arc -->
  <path d="M 105 125 C 85 120, 70 128, 62 140" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrowCurve)"/>

  <!-- Cues -->
  <text x="170" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Fulcrum over Mid-Back</text>
  <text x="170" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Support head with both hands</text>
  <text x="170" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Keep hips resting on floor</text>
  <text x="170" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Inhale open, exhale relax</text>
</svg>
