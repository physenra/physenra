<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Copenhagen Adductor Exercise (Groin Strain Protocol)</title>
  <desc>Patient in side-plank with top leg resting on bench, elevating lower body to eccentrically and isometrically strengthen groin adductors.</desc>
  <defs>
    <linearGradient id="adductorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="175" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">GROIN / ADDUCTOR • STRENGTH</text>

  <!-- Floor Line -->
  <line x1="25" y1="185" x2="295" y2="185" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Support Bench on Right -->
  <rect x="200" y="130" width="85" height="15" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <line x1="215" y1="145" x2="215" y2="185" stroke="#94a3b8" stroke-width="3"/>
  <line x1="270" y1="145" x2="270" y2="185" stroke="#94a3b8" stroke-width="3"/>

  <!-- Forearm & Elbow on Ground -->
  <line x1="75" y1="145" x2="75" y2="182" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <line x1="75" y1="182" x2="105" y2="182" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="60" cy="130" r="11" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>

  <!-- Top Leg Anchored on Bench (Ankle/lower leg) -->
  <line x1="140" y1="142" x2="235" y2="128" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Adductor Muscle Active Load Zone -->
  <line x1="145" y1="142" x2="195" y2="135" stroke="url(#adductorGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Torso & Pelvis Elevated in Straight Line -->
  <line x1="75" y1="145" x2="140" y2="142" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Bottom Leg (Free, held adducted just under bench) -->
  <line x1="140" y1="142" x2="205" y2="152" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Upward Pelvic Lift Vector Arrow -->
  <line x1="135" y1="172" x2="135" y2="150" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowUp)"/>

  <!-- Cues -->
  <text x="145" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Elevate Pelvis in Line</text>
  <text x="145" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Top leg rests on bench</text>
  <text x="145" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Engage inner thigh &amp; core</text>
  <text x="145" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Hold 5–15 seconds</text>
</svg>
