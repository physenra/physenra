<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Standing Calf Stretch (Gastrocnemius)</title>
  <desc>Patient standing in staggered stance facing wall with hands on wall, back leg straight with heel flat on floor.</desc>
  <defs>
    <linearGradient id="calfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="150" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">ANKLE / CALF • STRETCHING</text>

  <!-- Floor Line -->
  <line x1="25" y1="190" x2="295" y2="190" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Wall on Right Side -->
  <line x1="260" y1="40" x2="260" y2="190" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Patient Silhouette -->
  <!-- Hands on Wall -->
  <line x1="205" y1="105" x2="258" y2="105" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Head & Forward-Leaning Torso -->
  <circle cx="205" cy="80" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <path d="M 205 92 L 180 135" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Front Leg (Bent knee, foot flat) -->
  <path d="M 180 135 L 210 160 L 215 190" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 210 190 L 225 190" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Back Target Leg (Straight knee, heel pressed firmly flat) -->
  <path d="M 180 135 L 120 188" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <!-- Target Gastrocnemius Stretch Zone Highlight -->
  <path d="M 160 152 L 132 178" stroke="url(#calfGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Foot Flat on Floor -->
  <path d="M 115 188 L 135 188" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Heel Ground Contact Indicator -->
  <ellipse cx="120" cy="190" rx="8" ry="2" fill="#0d9488"/>

  <!-- Forward Pelvis Shift Arrow -->
  <path d="M 165 125 L 185 125" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="187,125 181,121 181,129" fill="#0284c7"/>

  <!-- Cues -->
  <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Keep Back Heel Flat</text>
  <text x="25" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Keep back knee straight</text>
  <text x="25" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Toes pointing forward</text>
  <text x="25" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Hold stretch 30 seconds</text>
</svg>
