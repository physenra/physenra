<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Dead Bug (Anterior Core Motor Control)</title>
  <desc>Patient supine with arms vertical and knees bent at 90 degrees, lowering opposite arm and leg while maintaining flat lower back against mat.</desc>
  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="175" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">LUMBAR / CORE • MOTOR CONTROL</text>

  <!-- Mat Surface -->
  <line x1="25" y1="175" x2="295" y2="175" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Patient Supine Flat Back -->
  <circle cx="65" cy="165" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <path d="M 78 172 L 155 172" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Core Flattening Indicator (No arching cue) -->
  <rect x="105" y="170" width="35" height="5" rx="2" fill="#0d9488"/>

  <!-- Stable Stationary Arm & Leg (90/90 position) -->
  <!-- Vertical Left Arm -->
  <line x1="95" y1="172" x2="95" y2="105" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Right Leg at 90 degrees hip & knee -->
  <path d="M 155 172 L 155 125 L 185 125" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Moving Contralateral Pair (Extending downward) -->
  <!-- Right Arm Lowering Overhead -->
  <path d="M 95 172 L 45 145" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left Leg Lowering Toward Floor -->
  <path d="M 155 172 L 235 155 L 255 155" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Movement Arrows -->
  <path d="M 75 125 C 60 135, 52 145, 48 152" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2" marker-end="url(#arrowDown)"/>
  <path d="M 195 135 C 220 140, 235 150, 245 158" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="2 2" marker-end="url(#arrowDown)"/>

  <!-- Cues -->
  <text x="175" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Imprint Lower Back to Floor</text>
  <text x="175" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Do not let lower back arch!</text>
  <text x="175" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Slowly lower opposite arm/leg</text>
  <text x="175" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Tap heel, return smoothly</text>
</svg>
