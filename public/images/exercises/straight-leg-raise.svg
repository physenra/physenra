<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Straight Leg Raise (Supine)</title>
  <desc>Patient lying on back with opposite knee bent and raising target straight leg up to 45 degrees.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="125" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">HIP • STRENGTHENING</text>

  <!-- Treatment Mat -->
  <line x1="25" y1="170" x2="295" y2="170" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Patient Head & Torso Flat on Mat -->
  <circle cx="55" cy="158" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <path d="M 68 165 L 140 165" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Opposite Non-Target Leg (Bent at knee for spinal stability) -->
  <path d="M 140 165 L 175 130 L 195 168" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target Leg (Starting position ghosted) -->
  <path d="M 140 165 L 260 165" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Target Leg (Raised position at 45 degrees) -->
  <path d="M 140 165 L 230 100" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Foot (Dorsiflexed) -->
  <path d="M 230 100 L 225 85 L 238 88" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Movement Arc & Vector Arrow -->
  <path d="M 250 160 C 255 135, 245 115, 235 105" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Clinical Cues -->
  <text x="175" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Raise Leg to 45°</text>
  <text x="175" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Keep knee completely locked</text>
  <text x="175" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Maintain stable core and flat back</text>
</svg>
