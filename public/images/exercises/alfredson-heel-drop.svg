<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <title>Eccentric Heel Drop on Step (Alfredson Protocol)</title>
  <desc>Patient standing with ball of foot on edge of step, slowly lowering heel below step level to eccentrically load the Achilles tendon.</desc>
  <defs>
    <linearGradient id="achillesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="320" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Clinical Focus Badge -->
  <rect x="16" y="14" width="180" height="22" rx="4" fill="#e0f2fe"/>
  <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">ACHILLES • ECCENTRIC LOADING</text>

  <!-- Step / Platform -->
  <rect x="120" y="165" width="150" height="35" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="25" y1="200" x2="295" y2="200" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Support Rail / Wall on Right -->
  <line x1="220" y1="60" x2="220" y2="165" stroke="#94a3b8" stroke-width="3"/>
  <!-- Patient Hand on Rail -->
  <circle cx="220" cy="100" r="4" fill="#1e293b"/>
  <path d="M 160 85 L 220 100" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Patient Standing on Edge of Step -->
  <circle cx="150" cy="55" r="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="3.5"/>
  <line x1="150" y1="67" x2="148" y2="115" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Opposite Non-Working Leg (Tucked up) -->
  <path d="M 148 115 L 170 135 L 165 155" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Working Target Leg (Straight knee) -->
  <line x1="148" y1="115" x2="135" y2="175" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

  <!-- Achilles Tendon Active Loading Zone -->
  <line x1="138" y1="155" x2="135" y2="178" stroke="url(#achillesGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Foot on Step Edge (Ball on step, Heel dropped below step) -->
  <path d="M 115 185 L 135 175 L 155 165" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ghosted Flat Heel Position -->
  <line x1="120" y1="165" x2="155" y2="165" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="2 2"/>

  <!-- Heel Drop Downward Vector Arrow -->
  <line x1="115" y1="168" x2="115" y2="182" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- Cues -->
  <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Slow 3-Second Drop</text>
  <text x="25" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Ball of foot on step edge</text>
  <text x="25" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Lower heel below step level</text>
  <text x="25" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Use hands/other foot to return</text>
</svg>
