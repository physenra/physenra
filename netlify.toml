# Physenra V1.0.0 – Netlify Production Hosting Configuration
# Classification: HOSTING CONFIGURATION ONLY (Category 1)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions Configuration
[functions]
  directory = "netlify/functions"

[functions."process-commission-outbox"]
  schedule = "*/5 * * * *"

[functions."reconcile-referral-commissions"]
  schedule = "0 */6 * * *"


# API Route redirects for server-side Paystack payment infrastructure
[[redirects]]
  from = "/api/paystack-webhook"
  to = "/.netlify/functions/paystack-webhook"
  status = 200

[[redirects]]
  from = "/api/initialize-payment"
  to = "/.netlify/functions/initialize-payment"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/reconcile-payment"
  to = "/.netlify/functions/reconcile-payment"
  status = 200

[[redirects]]
  from = "/api/form-drafts"
  to = "/.netlify/functions/form-drafts"
  status = 200

[[redirects]]
  from = "/api/recovery-companion"
  to = "/.netlify/functions/recovery-companion"
  status = 200

[[redirects]]
  from = "/api/process-commission-outbox"
  to = "/.netlify/functions/process-commission-outbox"
  status = 200

[[redirects]]
  from = "/api/reconcile-referral-commissions"
  to = "/.netlify/functions/reconcile-referral-commissions"
  status = 200

[[redirects]]
  from = "/api/invite-sales-rep"
  to = "/.netlify/functions/invite-sales-rep"
  status = 200

# SPA routing fallback: rewrite all non-asset requests to /index.html (HTTP 200)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
